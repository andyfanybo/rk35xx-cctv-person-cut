name: Portable checks
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
      - run: node --check web/app.js
      - run: node --check web/task-overview.js
      - run: node --test tests/task_overview_ui.cjs
      - run: python tools/check_release.py


  overview-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/preview_task_overview.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: task-overview-preview
          path: ui-preview/
          if-no-files-found: error
